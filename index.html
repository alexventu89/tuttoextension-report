<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tutto Extension</title>
<style>
:root{--bg:#faf7f4;--ink:#1f1a17;--ink-2:#4a423d;--surface:#ffffff;--baseline:#c9bfb7;--accent:#b5483a;--muted:#6b625c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--ink:#f2ece6;--ink-2:#cfc5bc;--surface:#221d19;--baseline:#4a423d;--accent:#e08a7a;--muted:#a79d94}}
:root[data-theme="dark"]{--bg:#17130f;--ink:#f2ece6;--ink-2:#cfc5bc;--surface:#221d19;--baseline:#4a423d;--accent:#e08a7a;--muted:#a79d94}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-inline:16px}
main{max-width:420px;margin:0 auto;padding-block:12vh 40px;display:flex;flex-direction:column;gap:28px}
header{display:flex;align-items:center;gap:16px;padding-bottom:18px;border-bottom:2px solid var(--accent)}
h1{margin:0;font-size:24px;font-weight:900;line-height:1.15;text-wrap:balance}
form{display:flex;flex-direction:column;gap:14px}
label{font-weight:700}
input[type=password]{font:inherit;font-size:18px;padding:12px 14px;border:1px solid var(--baseline);border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
.ricorda{display:flex;align-items:center;gap:8px;font-weight:400;color:var(--ink-2)}
button{font:inherit;font-weight:900;font-size:17px;padding:13px 18px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);cursor:pointer;min-height:48px}
button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.5em;margin:0;color:var(--ink)}
.msg.errore{font-weight:700}
.msg.errore::before{content:"✕ ";color:var(--accent)}
footer{color:var(--muted);font-size:14px}
</style></head><body>
<main>
<header><h1>Tutto Extension</h1></header>
<form id="f" autocomplete="on">
<label for="pw">Password</label>
<input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
<label class="ricorda"><input id="ricorda" type="checkbox"> Ricordala su questo dispositivo</label>
<button id="apri" type="submit">Apri la pagina</button>
<p id="msg" class="msg" role="status" aria-live="polite"></p>
<noscript><p class="msg errore">Per aprire la pagina serve JavaScript attivo.</p></noscript>
</form>
<footer>Pagina riservata. Si apre con la password che ti è stata data.</footer>
</main>
